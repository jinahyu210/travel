<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마리박현숙 — 작품과 기록</title><meta name="description" content="화가 마리박현숙의 온라인 갤러리이자 작품 포트폴리오. 작품과 그 안에 담긴 이야기를 감상하세요."><link rel="stylesheet" href="./style.css"><script defer src="./gallery-rules.js"></script><script defer src="./app.js"></script></head>
<body>
<header><a href="/" class="brand">Mari<span class="brand-artist">Park Hyun Sook</span><span>마리 박현숙 온라인 갤러리</span></a><nav class="site-nav" aria-label="주 메뉴"><a href="/" aria-current="page">작품</a><a href="/exhibitions">Exhibitions</a><a href="/contact">Contact</a><button id="admin" class="quiet">관리자 · 작품 등록 ↗</button></nav></header>
<main><section class="intro"><h1>Works<span>마리박현숙</span></h1></section>
<section class="collection" aria-labelledby="collection-title"><div class="collection-head"><div><span class="eyebrow">SELECTED WORKS</span><h2 id="collection-title">작품 둘러보기 <small id="count">0</small></h2></div><input id="search" type="search" aria-label="작품명, 시리즈 또는 제작 연도 검색" placeholder="작품명, 시리즈 또는 제작 연도 검색 ↗"></div><p id="status" role="status">작품을 불러오는 중입니다.</p><div id="grid" tabindex="0" role="region" aria-label="시리즈별 작품 목록"></div></section><section id="series-view" hidden aria-labelledby="series-title"><div class="series-view-heading"><button id="series-back" type="button">← All works</button></div><h2 id="series-title" tabindex="-1"></h2><div id="series-note-slot" hidden></div><div id="series-gallery" tabindex="0" role="region" aria-label="시리즈 작품 가로 목록"></div><div class="series-view-bottom"><div class="navigation" aria-label="시리즈 작품 이동"><button id="series-previous" type="button" aria-label="이전 작품으로 이동" aria-controls="series-gallery" disabled>←</button><button id="series-next" type="button" aria-label="다음 작품으로 이동" aria-controls="series-gallery" disabled>→</button></div></div></section><section id="note-view" hidden aria-labelledby="note-title"><button id="note-back" type="button" class="quiet">← 돌아가기</button><span class="eyebrow">작가노트</span><h1 id="note-title" tabindex="-1"></h1><div id="note-full-text"></div><button id="note-edit" type="button" class="quiet">작가노트 편집 ↗</button></section></main>
<footer><a class="footer-brand" href="/">Mari<span class="brand-artist">Park Hyun Sook</span><span>마리 박현숙 온라인 갤러리</span></a><span class="footer-copyright">© 2026 Park Hyun Sook. All rights reserved.</span></footer>
<dialog id="upload"><form id="upload-form"><div class="dialog-head"><h2 id="upload-title">새로운 작품 등록</h2><button type="button" class="close" aria-label="닫기">×</button></div><p class="muted">작품과 그 안에 담긴 이야기를 전해 주세요.</p><label>관리자 비밀번호<input name="password" type="password" autocomplete="current-password" required></label><label><span id="upload-image-label">작품 이미지</span><input name="file" type="file" accept="image/png,image/jpeg,image/webp,image/heic,image/heif,.heic,.heif" required><small>JPG, PNG, WebP, HEIC · 최대 3MB</small></label><img id="upload-current-image" alt="현재 작품 이미지" hidden><div class="form-row"><label>작품명<input name="title" maxlength="120" required></label><label>작가명<input name="artist" maxlength="120" value="마리박현숙" readonly required></label></div><button id="note-open" type="button" class="quiet">시리즈 작가노트 편집 ↗</button><button id="rename-open" type="button" class="quiet">시리즈 이름 수정 ↗</button><div class="series-picker"><label for="series-select">시리즈 제목</label><select id="series-select" name="seriesChoice"><option value="">시리즈 미지정</option><option value="new">+ 새 시리즈</option></select></div><label id="new-series-label" hidden>새 시리즈 제목<input name="series" maxlength="120"></label><label>제작 연도<input name="year" maxlength="20" placeholder="예: 2026"></label><label>재료 / 기법<input name="medium" maxlength="160" placeholder="Acrylic on canvas"></label><div class="canvas-dimensions"><label>호수<select name="canvas_size" aria-label="호수"><option value="">선택</option><option value="비규격">직접 입력</option></select></label><label>가로 (cm)<input name="width_cm" type="number" min="0.01" max="10000" step="any" placeholder="53" inputmode="decimal"></label><button id="swap-dimensions" type="button" aria-label="가로와 세로 바꾸기" title="가로와 세로 바꾸기" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/></svg></button><label>세로 (cm)<input name="height_cm" type="number" min="0.01" max="10000" step="any" placeholder="45.5" inputmode="decimal"></label></div><input name="dimensions" type="hidden"><label>가격<input name="price" maxlength="80" placeholder="₩1,500,000 또는 가격 문의"></label><label>작품 이야기<textarea name="description" maxlength="2000" rows="3"></textarea></label><p id="upload-status" role="status"></p><button type="submit" class="primary">작품 등록하기 ↗</button></form></dialog>
<dialog id="detail"><button type="button" class="close" aria-label="닫기">×</button><div class="detail-stage"><button id="detail-previous" type="button" class="detail-arrow" aria-label="이전 작품 보기" hidden>←</button><img id="detail-image" alt=""><button id="detail-next" type="button" class="detail-arrow" aria-label="다음 작품 보기" hidden>→</button></div><div class="detail-copy"><h2 id="detail-title"></h2><p id="detail-artist" class="visually-hidden"></p><dl id="detail-metadata" hidden></dl><p id="detail-description"></p><button id="edit-artwork" type="button" class="quiet">작품 편집 ↗</button></div></dialog>
<dialog id="rename-dialog"><form id="series-rename-form"><div class="dialog-head"><h2>시리즈 이름 수정</h2><button type="button" class="close" aria-label="닫기">×</button></div><label>관리자 비밀번호<input name="renamePassword" type="password" autocomplete="current-password" required></label><label for="rename-series-select">수정할 시리즈</label><select id="rename-series-select" required><option value="" disabled selected>시리즈 선택</option></select><label>새 시리즈 제목<input id="rename-title" maxlength="120" required></label><p id="rename-status" role="status"></p><button type="submit" class="primary">제목 저장하기</button></form></dialog>
<dialog id="note-dialog"><form id="note-form"><div class="dialog-head"><h2>시리즈 작가노트</h2><button type="button" class="close" aria-label="닫기">×</button></div><label>관리자 비밀번호<input name="notePassword" type="password" autocomplete="current-password" required></label><label for="note-series-select">시리즈</label><select id="note-series-select" required><option value="" disabled selected>시리즈 선택</option></select><label>작가노트<textarea id="note-editor" maxlength="20000" rows="12"></textarea></label><p id="note-status" role="status"></p><button type="submit" class="primary">작가노트 저장하기</button></form></dialog>
</body></html>
