<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — Park Hyun Sook</title><meta name="description" content="마리 박현숙 온라인 갤러리에 비공개 메모를 남겨주세요."><link rel="stylesheet" href="./style.css"><script defer src="./gallery-upload.js"></script><script defer src="./contact.js"></script></head>
<body class="contact-page">
<header><a href="/" class="brand">Mari<span class="brand-artist">Park Hyun Sook</span><span>마리 박현숙 온라인 갤러리</span></a><nav class="site-nav" aria-label="주 메뉴"><a href="/">작품</a><a href="/exhibitions">Exhibitions</a><a href="/contact" aria-current="page">Contact</a><a href="/?register=1" class="quiet">관리자 · 작품 등록 ↗</a></nav></header>
<main><section class="intro contact-intro"><h1>Contact<span>작품 · 전시 문의</span></h1></section><section class="contact-panel" aria-labelledby="contact-heading"><div class="contact-introduction"><span class="eyebrow">LEAVE A NOTE</span><h2 id="contact-heading">작가에게 메모를 남겨주세요.</h2><p class="muted">남겨주신 메모는 공개되지 않으며,<br>관리자만 확인할 수 있습니다.</p><button id="inbox-open" type="button" class="quiet">관리자 메모함 ↗</button></div><form id="contact-form"><label>이름 (선택)<input name="name" maxlength="80" autocomplete="name"></label><label>답변받을 연락처 (선택)<input name="reply_to" maxlength="200" placeholder="이메일 또는 연락처"></label><label>메모<textarea name="message" maxlength="4000" rows="6" required></textarea></label><p id="contact-status" role="status"></p><button class="primary" type="submit">메모 남기기 ↗</button></form></section></main>
<footer><a class="footer-brand" href="/"><span>마리 박현숙 온라인 갤러리</span></a><span class="footer-copyright">© 2026 Park Hyun Sook. All rights reserved.</span></footer>
<dialog id="inbox-dialog"><form id="inbox-form"><div class="dialog-head"><h2>관리자 메모함</h2><button type="button" class="close" aria-label="닫기">×</button></div><label>관리자 비밀번호<input name="inboxPassword" type="password" autocomplete="current-password" required></label><button type="submit" class="primary">메모 확인하기</button><p id="inbox-status" role="status"></p></form><div id="inbox-messages"></div></dialog>
</body></html>
