<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — Park Hyun Sook</title><meta name="description" content="마리 박현숙 온라인 갤러리에 비공개 메모를 남겨주세요."><link rel="stylesheet" href="./style.css"><script defer src="./gallery-upload.js"></script><script defer src="./gallery-admin.js"></script><script defer src="./contact.js"></script></head>
<body class="contact-page">
<header><a href="/" class="brand">Mari<span class="brand-artist">Park Hyun Sook</span><span>마리 박현숙 온라인 갤러리</span></a><nav class="site-nav" aria-label="주 메뉴"><a href="/">Works</a><a href="/exhibitions">Exhibitions</a><a href="/contact" aria-current="page">Contact</a><a href="/?register=1" class="quiet" data-admin-only>관리자 · 작품 등록 ↗</a><button type="button" class="quiet" data-admin-toggle>관리자 로그인</button></nav></header>
<main><section class="intro contact-intro"><h1>Contact<span>작품 · 전시 문의</span></h1></section><section class="contact-panel" data-visitor-only aria-labelledby="contact-heading"><div class="contact-introduction"><span class="eyebrow">LEAVE A NOTE</span><h2 id="contact-heading">작가에게 메모를 남겨주세요.</h2><p class="muted">남겨주신 메모는 공개되지 않으며,<br>관리자만 확인할 수 있습니다.</p></div><form id="contact-form"><label>이름 (선택)<input name="name" maxlength="80" autocomplete="name"></label><label>답변받을 연락처 (선택)<input name="reply_to" maxlength="200" placeholder="이메일 또는 연락처"></label><label>메모<textarea name="message" maxlength="4000" rows="6" required></textarea></label><p id="contact-status" role="status"></p><button class="primary" type="submit">메모 남기기 ↗</button></form></section><section id="admin-inbox" class="admin-inbox" data-admin-only aria-labelledby="inbox-heading">
  <div class="inbox-heading-row"><div class="inbox-heading-title"><h2 id="inbox-heading">받은 메모</h2><span id="inbox-count" class="muted"></span></div><button id="inbox-refresh" type="button" class="quiet">새로고침 ↻</button></div>
  <p id="inbox-status" role="status"></p><div id="inbox-messages" tabindex="0" role="region" aria-label="받은 메모 카드 목록"></div>
</section></main>
<footer><a class="footer-brand" href="/"><span>마리 박현숙 온라인 갤러리</span></a><span class="footer-copyright">© 2026 Park Hyun Sook. All rights reserved.</span></footer>
<dialog data-admin-dialog id="message-delete-dialog" aria-labelledby="message-delete-title">
  <form id="message-delete-form"><div class="dialog-head"><h2 id="message-delete-title">메모 삭제</h2><button type="button" class="close" aria-label="취소하고 닫기">×</button></div>
    <p class="muted">이 메모를 삭제할까요? 삭제한 메모는 복구할 수 없습니다.</p><p id="delete-message-preview" class="muted"></p>
    <label>관리자 비밀번호<input name="deletePassword" type="password" autocomplete="current-password" required></label>
    <p id="message-delete-status" role="status"></p><button type="submit" class="primary">삭제하기</button>
  </form>
</dialog>
</body></html>
